# Локальный стек ядра «Астрокосмос».
# Обсерваторный Diptich_hub сюда не входит — только URL в .env.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astrocosmos}
      POSTGRES_USER: ${POSTGRES_USER:-astrocosmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astrocosmos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astrocosmos}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-astrocosmos}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres

  beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
